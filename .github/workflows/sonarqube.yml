name: SonarQube

on:
  push:
    branches:
      - '**'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-coverage:
    name: Frontend Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run frontend coverage
        working-directory: Frontend
        run: npm run coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: Frontend/coverage/lcov.info
          retention-days: 1

  backend-coverage:
    name: Backend Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        working-directory: Backend
        run: chmod +x mvnw

      - name: Run targeted backend coverage
        working-directory: Backend
        run: >
          ./mvnw -B -ntp test jacoco:report
          -Dtest=VonMagParserTest,RovisionParserTest,CaseSmartParserTest,CategoryMapperTest,DeviceImportServiceTest,SetupServiceTest,SetupControllerTest,ContentModerationWorkerTest,CommentRateLimiterServiceTest,RateLimitingFilterTest,BadWordFilterServiceTest,ArticleServiceTest,GlobalExceptionHandlerTest,PlugSpecificationExtractorTest,SensorSpecificationExtractorTest

      - name: Upload backend analysis files
        uses: actions/upload-artifact@v4
        with:
          name: backend-analysis
          path: |
            Backend/target/classes
            Backend/target/test-classes
            Backend/target/site/jacoco/jacoco.xml
          retention-days: 1

  analyze:
    name: SonarQube Analyze
    runs-on: ubuntu-latest
    needs:
      - frontend-coverage
      - backend-coverage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: Frontend/coverage

      - name: Download backend analysis files
        uses: actions/download-artifact@v4
        with:
          name: backend-analysis
          path: Backend/target

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
