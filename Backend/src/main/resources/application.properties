spring.application.name=SmartHouseBuilder

server.port=20025

spring.profiles.active=dev

jwt.secret=AcesastaEsteOCheieSecretaMultMaiLungaSiSiguraPentruAplicatiaMea1234567890!

# Access-token lifetime: 24h. The frontend stores this in localStorage and
# attaches it as Authorization: Bearer <jwt> on every request.
jwt.expiration-ms=86400000

# Refresh-token lifetime: 30 days. Required by RefreshTokenService — without
# this property the service's @Value lookup fails and Spring Boot won't even
# start. Bug introduced when the refresh flow was added; was never wired up.
jwt.refresh-expiration-ms=2592000000

# Rate Limiting (Production defaults: 10 requests/min)
app.rate-limit.capacity=10
app.rate-limit.minutes=1
