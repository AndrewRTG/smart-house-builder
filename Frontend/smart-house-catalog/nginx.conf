server {
    listen 80;
    server_name localhost;

    # 1. Partea de Frontend (React)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # REZOLVARE REFRESH: Dacă Nginx nu găsește fișierul fizic, 
        # trimite totul către index.html pentru ca React Router să preia controlul.
        try_files $uri $uri/ /index.html;
    }

    # 2. Partea de Backend (Reverse Proxy)
    # Orice cerere care pleacă din browser către /api/ este interceptată aici.
    location /api/ {
        # 'backend' este numele serviciului din docker-compose.yml
        proxy_pass http://backend:20025;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}